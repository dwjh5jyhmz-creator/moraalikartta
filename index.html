<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moraalikartta</title><style>
:root{font-family:system-ui;background:#101522;color:#f4f6fa}body{margin:0;padding:14px;max-width:950px;margin:auto}h1{margin-bottom:4px}p{color:#c1c9d6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{border:0;border-radius:9px;padding:10px;background:#303b52;color:white;font-size:15px}.tier{display:flex;min-height:100px;border:1px solid #3a4356;border-radius:12px;overflow:hidden;margin:9px 0;background:#1c2434}.label{width:62px;flex-shrink:0;display:grid;place-items:center;font-size:30px;font-weight:900;color:#101522}.cards{padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}.card{width:110px;border-radius:10px;background:#303b52;overflow:hidden;cursor:grab;touch-action:manipulation}.card img{width:100%;height:90px;object-fit:cover;background:#4b5568}.card b,.card small{display:block;padding:3px 7px}.card b{font-size:13px}.card small{font-size:11px;color:#d1d8e4}.pool{min-height:160px}.hint{font-size:13px}.selected{outline:3px solid white}#info{min-height:20px;color:#ffe6a0}dialog{background:#202a3d;color:white;border:1px solid #667;border-radius:15px;max-width:85vw}dialog button{margin:4px}
</style></head><body><h1>🌍 Moraalikartta</h1><p>Järjestä 60 tunnettua henkilöä oman moraalisen arviosi mukaan. Tämä on mielipidepeli, ei objektiivinen arvio.</p><div class="toolbar"><label>Pelaaja <select id="player"><option value="mina">Minä</option><option value="kaveri">Kaveri</option></select></label><button id="export">Lataa tulos</button><button id="reset">Tyhjennä oma lista</button></div><p class="hint">📱 Puhelimella: napauta henkilöä ja valitse taso. Tietokoneella voit myös raahata kortteja.</p><p id="info"></p><main id="board"></main><dialog id="picker"><h3 id="pickname"></h3><p id="pickdesc"></p><div id="choices"></div><button id="close">Sulje</button></dialog><script>
const people=[{"n": "Elon Musk", "c": "Teknologia", "d": "Teslan ja SpaceX:n johtaja."}, {"n": "Mark Zuckerberg", "c": "Teknologia", "d": "Metan perustaja ja johtaja."}, {"n": "Jeff Bezos", "c": "Teknologia", "d": "Amazonin perustaja."}, {"n": "Bill Gates", "c": "Teknologia", "d": "Microsoftin toinen perustaja."}, {"n": "Tim Cook", "c": "Teknologia", "d": "Applen toimitusjohtaja."}, {"n": "Satya Nadella", "c": "Teknologia", "d": "Microsoftin toimitusjohtaja."}, {"n": "Sundar Pichai", "c": "Teknologia", "d": "Googlen ja Alphabetin johtaja."}, {"n": "Sam Altman", "c": "Teknologia", "d": "OpenAI:n toimitusjohtaja."}, {"n": "Jensen Huang", "c": "Teknologia", "d": "Nvidian perustaja ja johtaja."}, {"n": "Larry Page", "c": "Teknologia", "d": "Googlen toinen perustaja."}, {"n": "Sergey Brin", "c": "Teknologia", "d": "Googlen toinen perustaja."}, {"n": "Jack Dorsey", "c": "Teknologia", "d": "Twitterin toinen perustaja."}, {"n": "Peter Thiel", "c": "Teknologia", "d": "PayPalin toinen perustaja ja sijoittaja."}, {"n": "Steve Jobs", "c": "Teknologia", "d": "Applen toinen perustaja (1955–2011)."}, {"n": "Shou Zi Chew", "c": "Teknologia", "d": "TikTokin toimitusjohtaja."}, {"n": "Donald Trump", "c": "Maailma", "d": "Yhdysvaltain presidentti."}, {"n": "Joe Biden", "c": "Maailma", "d": "Yhdysvaltain entinen presidentti."}, {"n": "Barack Obama", "c": "Maailma", "d": "Yhdysvaltain entinen presidentti."}, {"n": "George W. Bush", "c": "Maailma", "d": "Yhdysvaltain entinen presidentti."}, {"n": "Kamala Harris", "c": "Maailma", "d": "Yhdysvaltain entinen varapresidentti."}, {"n": "Vladimir Putin", "c": "Maailma", "d": "Venäjän presidentti."}, {"n": "Volodymyr Zelenskyi", "c": "Maailma", "d": "Ukrainan presidentti."}, {"n": "Xi Jinping", "c": "Maailma", "d": "Kiinan johtaja."}, {"n": "Kim Jong-un", "c": "Maailma", "d": "Pohjois-Korean johtaja."}, {"n": "Benjamin Netanyahu", "c": "Maailma", "d": "Israelin pääministeri."}, {"n": "Ali Khamenei", "c": "Maailma", "d": "Iranin entinen ylin joh i", "d": "Vasemmistoliiton entinen puheenjohtaja, europarlamentaarikko."}, {"n": "Sanna Marin", "c": "Suomi", "d": "Suomen entinen pääministeri."}, {"n": "Sauli Niinistö", "c": "Suomi", "d": "Suomen entinen presidentti."}, {"n": "Sanna Ukkola", "c": "Suomi", "d": "Suomalainen toimittaja ja juontaja."}, {"n": "Pekka Haavisto", "c": "Suomi", "d": "Suomalainen poliitikko, entinen ulkoministeri."}, {"n": "Antti Lindtman", "c": "Suomi", "d": "SDP:n puheenjohtaja."}, {"n": "Elina Valtonen", "c": "Suomi", "d": "Suomen ulkoministeri."}, {"n": "Annika Saarikko", "c": "Suomi", "d": "Keskustan entinen puheenjohtaja."}, {"n": "Paavo Väyrynen", "c": "Suomi", "d": "Pitkän linjan suomalainen poliitikko."}, {"n": "Teuvo Hakkarainen", "c": "Suomi", "d": "Suomalainen entinen kansanedustaja."}];
const levels=[["S","#f28b82"],["A","#ffb86b"],["B","#ffe082"],["C","#a5d6a7"],["D","#90caf9"],["F","#ce93d8"],["?","#aab4c4"]];
const key=()=> "moraalikartta-v3-"+document.querySelector("#player").value;
let ranks={},selected=null;
function load(){try{ranks=JSON.parse(localStorage.getItem(key())||"{}")}catch(e){ranks={}}render()}
function save(){localStorage.setItem(key(),JSON.stringify(ranks))}
function place(name,tier){if(tier==="?")delete ranks[name];else ranks[name]=tier;save();document.querySelector("#picker").close();render()}
function render(){const board=document.querySelector("#board");board.innerHTML="";for(const [tier,color] of levels){let row=document.createElement("section");row.className="tier";row.dataset.tier=tier;row.innerHTML='<div class="label" style="background:'+color+'">'+(tier==="?"?"★":tier)+'</div><div class="cards '+(tier==="?"?"pool":"")+'"></div>';let box=row.querySelector(".cards");row.addEventListener("dragover",e=>e.preventDefault());row.addEventListener("drop",e=>{e.preventDefault();if(selected)place(selected,tier)});for(const p of people.filter(p=>(ranks[p.n]||"?")===tier)){let card=document.createElement("article");card.className="card";card.draggable=true;
let initials=document.createElement("div");initials.style="height:90px;display:grid;place-items:center;font-size:28px;background:#45516a";initials.textContent=p.n.split(" ").map(x=>x[0]).slice(0,2).join("");card.append(initials);let title=document.createElement("b");title.textContent=p.n;let sub=document.createElement("small");sub.textContent=p.c;card.append(title,sub);card.title=p.d;card.addEventListener("click",()=>pick(p));card.addEventListener("dragstart",()=>selected=p.n);box.append(card)}board.append(row)}document.querySelector("#info").textContent=Object.keys(ranks).length+" / 60 sijoitettu"}
function pick(p){document.querySelector("#pickname").textContent=p.n;document.querySelector("#pickdesc").textContent=p.d;let choices=document.querySelector("#choices");choices.innerHTML="";for(const [tier] of levels){let b=document.createElement("button");b.textContent=tier==="?"?"Takaisin odottamaan":tier+"-taso";b.onclick=()=>place(p.n,tier);choices.append(b)}document.querySelector("#picker").showModal()}
document.querySelector("#close").onclick=()=>document.querySelector("#picker").close();document.querySelector("#player").onchange=load;document.querySelector("#reset").onclick=()=>{if(confirm("Tyhjennetäänkö tämän pelaajan lista?")){ranks={};save();render()}};document.querySelector("#export").onclick=()=>{let out=people.map(p=>({henkilo:p.n,taso:ranks[p.n]||"Ei sijoitettu"}));let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));a.download="moraalikartta-"+document.querySelector("#player").value+".json";a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
